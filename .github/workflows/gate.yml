name: Generalization Gate

# Runs the held-out generalization gate (cmd/alphaarc-gate) on GitHub's
# runners instead of the developer's machine. Manual only -- it's a ~30 min
# job that hits the (free) ARC-AGI-3 API, so it runs when you ask, not on
# every push.
#
# SETUP (one time): add the API key as a repository secret named ARC_API_KEY
#   (repo Settings -> Secrets and variables -> Actions -> New repository secret).
#   The workflow injects it as an env var and never prints it. The free API
#   means a leak has no billing blast radius, but it is still your key -- keep
#   it a secret, not a committed value.
#
# TRIGGER from your terminal without loading your machine:
#   gh workflow run gate.yml -f set=dev
#   gh run watch          # follow it live
# or use the "Run workflow" button in the Actions tab.
#
# MODES:
#   compare  (default) -- run against the committed gate/baseline.json; the job
#            goes RED if a dev game regressed.
#   establish          -- run with -update-baseline and upload the resulting
#            gate/baseline.json as an artifact for you to download and commit
#            (CI never pushes to the repo).

on:
  workflow_dispatch:
    inputs:
      set:
        description: "Which set to run"
        type: choice
        options: [dev, blind, all]
        default: dev
      mode:
        description: "compare against baseline, or establish a new one"
        type: choice
        options: [compare, establish]
        default: compare
      actions:
        description: "actions per game per repeat"
        default: "150"
      repeats:
        description: "repeats per game (averaged)"
        default: "3"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build player
        run: go build -o alphaarc-play ./cmd/alphaarc-play

      - name: Run gate
        env:
          ARC_API_KEY: ${{ secrets.ARC_API_KEY }}
        run: |
          if [ -z "$ARC_API_KEY" ]; then
            echo "ARC_API_KEY secret is not set -- add it in repo Settings -> Secrets -> Actions" >&2
            exit 2
          fi
          FLAGS="-player ./alphaarc-play -set ${{ inputs.set }} -actions ${{ inputs.actions }} -repeats ${{ inputs.repeats }}"
          if [ "${{ inputs.mode }}" = "establish" ]; then
            FLAGS="$FLAGS -update-baseline"
          fi
          # tee to a log for the artifact; the gate's own exit code (1 on a dev
          # regression) is what turns the job red, so preserve it via pipefail.
          set -o pipefail
          go run ./cmd/alphaarc-gate $FLAGS 2>&1 | tee gate-run.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ inputs.set }}-${{ inputs.mode }}
          path: |
            gate-run.log
            gate/baseline.json
          if-no-files-found: warn
